[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sssomatic"
version = "0.1.0"
description = "Align terms between metadata standards"
requires-python = ">=3.10"

[project.scripts]
sssomatic = "sssomatic.sssomatic:main"

[tool.setuptools.packages.find]
where = ["src"]